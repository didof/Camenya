name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: Scripts/verify-public-repository.sh

  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: Scripts/verify-dco.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  unsigned-build:
    name: Unsigned build
    # SpeechTranscriber is an iOS 26 SDK type. macos-15 defaults to Xcode 16.4,
    # whose compiler cannot parse that type even behind an availability check.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >-
          xcodebuild
          -project Camenya.xcodeproj
          -scheme Camenya
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /private/tmp/camenya-derived
          CODE_SIGNING_ALLOWED=NO
          build

  simulator-tests:
    name: Simulator tests
    # Keep the test compiler aligned with the build job: SpeechTranscriber
    # requires the iOS 26 SDK even when a test runs on an older runtime.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run automated tests on an installed iPhone Simulator
        run: |
          camenya_simulator_id="$(
            xcrun simctl list devices available |
              awk '
                /^[[:space:]]+iPhone/ {
                  split($0, fields, /[()]/)
                  print fields[2]
                  exit
                }
              '
          )"

          if [[ -z "$camenya_simulator_id" ]]; then
            echo "No available iPhone Simulator is installed on this runner." >&2
            exit 1
          fi

          xcodebuild \
            -project Camenya.xcodeproj \
            -scheme Camenya \
            -destination "platform=iOS Simulator,id=$camenya_simulator_id" \
            -derivedDataPath /private/tmp/camenya-tests-derived \
            CODE_SIGNING_ALLOWED=NO \
            test
